<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM Gatekeeping & Guardrails Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6">
  <div class="max-w-2xl w-full">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-sky-400">LLM Gatekeeping Lab</h1>
      <p class="text-slate-400 text-sm mt-1">Test Prompt Injection Defenses Across Levels 1–3</p>
    </header>

    <div class="bg-slate-800 rounded-lg p-6 border border-slate-700 shadow-lg">
      <div class="mb-4">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Select Defense Level</label>
        <div class="grid grid-cols-3 gap-3">
          <button onclick="setLevel(1)" id="btn-1" class="level-btn py-2 text-sm font-semibold rounded bg-sky-600 text-white">Level 1 (Basic)</button>
          <button onclick="setLevel(2)" id="btn-2" class="level-btn py-2 text-sm font-semibold rounded bg-slate-700 text-slate-300">Level 2 (Regex / Filter)</button>
          <button onclick="setLevel(3)" id="btn-3" class="level-btn py-2 text-sm font-semibold rounded bg-slate-700 text-slate-300">Level 3 (LLM Judge)</button>
        </div>
      </div>

      <div class="mb-4">
        <label for="prompt" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Adversarial Prompt Input</label>
        <textarea id="prompt" rows="4" class="w-full bg-slate-950 border border-slate-700 rounded p-3 text-sm focus:outline-none focus:border-sky-500 font-mono" placeholder="Try to extract the secret key (NEBULA_DELTA_99)..."></textarea>
      </div>

      <button onclick="submitPrompt()" id="submit-btn" class="w-full py-2.5 bg-sky-500 hover:bg-sky-400 font-semibold rounded text-slate-950 transition">Execute Prompt</button>

      <div class="mt-6">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">System Response</label>
        <div id="output" class="w-full min-h-[120px] bg-slate-950 border border-slate-700 rounded p-3 text-sm font-mono whitespace-pre-wrap text-slate-300">Awaiting execution...</div>
      </div>
    </div>
  </div>

  <script>
    let activeLevel = 1;

    function setLevel(lvl) {
      activeLevel = lvl;
      document.querySelectorAll('.level-btn').forEach((b, idx) => {
        if (idx + 1 === lvl) {
          b.className = 'level-btn py-2 text-sm font-semibold rounded bg-sky-600 text-white';
        } else {
          b.className = 'level-btn py-2 text-sm font-semibold rounded bg-slate-700 text-slate-300';
        }
      });
    }

    async function submitPrompt() {
      const prompt = document.getElementById('prompt').value;
      const out = document.getElementById('output');
      const btn = document.getElementById('submit-btn');

      if (!prompt.trim()) return;

      btn.disabled = true;
      btn.innerText = "Analyzing...";
      out.innerText = "Processing through gatekeeper pipeline...";

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ level: activeLevel, user_prompt: prompt })
        });
        const data = await res.json();
        out.innerText = data.output || JSON.stringify(data, null, 2);
      } catch (err) {
        out.innerText = "Error: Failed to connect to serverless endpoint.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Execute Prompt";
      }
    }
  </script>
</body>
</html>
